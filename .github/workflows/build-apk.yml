name: Build and publish feed

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: owfeed/owfeed/.github/workflows/feed.yml@v0.5.0
    with:
      owfeed-version: v0.5.0
      dry-run: true
      smoke-releases: "25.12"
      pre-build: |
        test -x package/root/etc/init.d/awg-path-optimizer
        test -x package/root/usr/sbin/awg-path-optimizer-status
        sh -n package/root/etc/init.d/awg-path-optimizer
        sh -n package/root/usr/sbin/awg-path-optimizer-status

  publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: owfeed/owfeed/.github/workflows/feed.yml@v0.5.0
    with:
      owfeed-version: v0.5.0
      smoke-releases: "25.12"
      pre-build: |
        test -x package/root/etc/init.d/awg-path-optimizer
        test -x package/root/usr/sbin/awg-path-optimizer-status
        sh -n package/root/etc/init.d/awg-path-optimizer
        sh -n package/root/usr/sbin/awg-path-optimizer-status
    secrets:
      sign-key: ${{ secrets.OPENWRT_APK_SIGNING_KEY }}
